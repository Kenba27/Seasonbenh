# Danh sach benh (SeasonsDiseases 1.1.0). Chinh sua thoai mai roi go /benh reload.
# season: SPRING | SUMMER | AUTUMN | WINTER | ALL (quanh nam)
# trigger (kiem tra moi 5 giay):
#   RAIN COLD_TEMP HEAT_TEMP FLOWERS NIGHT_OUTSIDE CROWD WATER_SWIM SWEAT_ARMOR SUN MOSQUITO
#   HUNGRY_LOW DEHYDRATION SWAMP HIGH_ALTITUDE SNOW_BIOME SNOW_GLARE
#   INSOMNIA (lau khong ngu, param = so tick tu lan ngu cuoi)  THUNDER (dung ngoai troi luc sam set)
#   UNDERGROUND (o duoi long dat, param = do cao Y toi da)
# trigger (tinh theo su kien):
#   EAT_RAW EAT_SPOILED EAT_BERRY BREAK_CROP EAT_SWEET (an banh quy, banh bi ngo)
# threshold: so lan kiem tra lien tiep (moi lan 5 giay) hoac so lan su kien; chance: xac suat khi dat nguong
# param: COLD_TEMP = nhiet do duoi muc nay; HEAT_TEMP = nhiet do tren muc nay; DEHYDRATION = so giay khong uong;
#        HIGH_ALTITUDE = do cao Y toi thieu; INSOMNIA = tick; UNDERGROUND = Y toi da
# duration: giay tu khoi neu khong chua (qua nua thoi gian benh se NANG HON: trieu chung tang 1 cap)
# contagious: true = benh lay giua nguoi choi dung gan nhau (khau trang chan lay)
# cures (chi can 1 cach):
#   MATERIAL            an/uong 1 lan            vd: MILK_BUCKET
#   MATERIAL~ten        vat pham co ten chua chu vd: HONEY_BOTTLE~Trà nóng
#   MATERIAL~!ten       vat pham KHONG co ten    vd: HONEY_BOTTLE~!Trà
#   MATERIAL*N          phai an/uong N lan       vd: CARROT*3
#   A+B+C               phai an du ca cac mon    vd: COOKIE+MILK_BUCKET
#   WATER_BOTTLE        chai nuoc (co the dung trong A+B, hoac WATER_BOTTLE*2)
#   SLEEP | SWIM | FIRE ngu qua dem / tam / ngoi gan lua
#   DOCTOR              kham thay lang (chuot phai dan lang Muc su, ton ngoc luc bao)
#   XP:N                tra N cap kinh nghiem (go /benh chua)

