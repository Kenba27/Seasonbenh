name: SeasonsDiseases
version: '1.1.0'
main: vn.seasonsdiseases.SeasonDiseases
api-version: '1.21'
softdepend: [Seasons]
description: He thong benh tat theo mua cho Seasons (39 benh, lay lan, dich benh, khau trang)
commands:
  benh:
    description: Xem benh dang mac va cach chua
    aliases: [suckhoe]
    usage: /benh [list|info <benh>|chua]
permissions:
  seasondiseases.admin:
    description: Quan tri he thong benh
    default: op
  seasondiseases.immune:
    description: Mien nhiem moi benh
    default: false
